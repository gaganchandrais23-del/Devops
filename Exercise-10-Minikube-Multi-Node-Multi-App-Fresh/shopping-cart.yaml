apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-cart
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shopping-cart
  template:
    metadata:
      labels:
        app: shopping-cart
    spec:
      containers:
        - name: shopping-cart
          image: multi-app:v1
          imagePullPolicy: Never
          command: ["python", "cart.py"]
          ports:
            - containerPort: 5001
